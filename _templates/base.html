<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1d1f">
  <meta name="description" content="{{description}}">
  <title>{{page_title}}</title>
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="Mehrdad Yazdani — Notes" href="/feed.xml">
  <link rel="stylesheet" href="/assets/blog.css">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="Mehrdad Yazdani — Notes">
  {{extra_head}}
  <script src="/assets/blog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="/" aria-label="Mehrdad Yazdani, home"><span class="monogram" aria-hidden="true">my.</span><span>Mehrdad Yazdani<span class="wordmark-detail">Notes &amp; explorations</span></span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/" {{active_notes}}>Notes</a>
      <a href="/about/" {{active_about}}>About</a>
      <a class="github-link" href="https://github.com/myazdani">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main" class="wrap">{{body}}</main>
  <footer class="site-footer wrap">
    <span>© 2026 Mehrdad Yazdani</span>
    <span><a href="/feed.xml">RSS feed <span aria-hidden="true">↗</span></a><span class="footer-dot" aria-hidden="true">·</span><a href="https://github.com/myazdani/myazdani.github.io">Source <span aria-hidden="true">↗</span></a></span>
  </footer>
</body>
</html>
