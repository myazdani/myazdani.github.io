<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="A visual journal of monochrome generative art.">
  <title>Soft Drift — a visual journal</title>
  <style>
    :root { color-scheme: light; --paper:#f8f7f4; --ink:#242321; --muted:#85827b; --line:#e7e5df; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shell { width:min(100% - 48px, 1120px); margin:0 auto; }
    .intro { padding:38px 0 32px; }
    .intro p { margin:0; color:#77746e; font-size:13px; letter-spacing:.015em; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:32px 24px; padding-bottom:72px; }
    .post { min-width:0; }
    .image-button { display:block; width:100%; border:0; padding:0; overflow:hidden; background:#eeede9; cursor:zoom-in; }
    .image-button img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
    .image-button:hover img, .image-button:focus-visible img { transform:scale(1.035); }
    .image-button:focus-visible { outline:2px solid #555; outline-offset:4px; }
    .meta { padding:12px 2px 0; }
    .eyebrow { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.11em; }
    .meta h2 { font-size:14px; font-weight:550; letter-spacing:-.025em; margin:7px 0 4px; }
    .meta p { color:#77746e; font-size:12px; line-height:1.55; margin:0; max-width:42ch; }
    footer { border-top:1px solid var(--line); padding:18px 0 28px; color:#96938d; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    dialog { padding:0; border:0; background:#111; color:#f3f2ed; width:min(94vw,980px); max-width:none; max-height:94vh; box-shadow:0 20px 80px #0008; }
    dialog::backdrop { background:#161613dd; backdrop-filter:blur(7px); }
    .lightbox { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(220px,.7fr); min-height:300px; }
    .lightbox img { width:100%; height:100%; max-height:86vh; object-fit:contain; background:#090909; }
    .detail { padding:26px; display:flex; flex-direction:column; align-items:flex-start; }
    .close { align-self:flex-end; border:1px solid #ffffff55; color:#fff; background:none; border-radius:50%; width:34px; height:34px; font-size:20px; cursor:pointer; }
    .detail time { color:#aaa79e; margin-top:auto; font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
    .detail h2 { font-size:19px; letter-spacing:-.04em; font-weight:500; margin:12px 0 8px; }
    .detail p { font-size:13px; color:#c7c5be; line-height:1.6; margin:0; }
    @media (max-width:760px) {
      .shell { width:min(100% - 28px,560px); }
      .intro { padding:28px 0 22px; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 12px; }
      .meta { padding-top:9px; }
      .meta h2 { font-size:12px; }
      .meta p { font-size:11px; }
      .eyebrow { font-size:9px; }
      .lightbox { display:block; }
      .lightbox img { max-height:66vh; }
      .detail { padding:18px; }
      .detail time { margin-top:22px; }
    }
    @media (max-width:420px) {
      .grid { gap:18px 10px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <div class="intro"><p>Monochrome studies in texture, density &amp; chance.</p></div>
      <section class="grid" id="gallery" aria-label="Artwork gallery"></section>
    </main>
    <footer>Soft Drift · visual journal</footer>
  </div>
  <dialog id="viewer" aria-label="Artwork detail">
    <div class="lightbox">
      <img id="large-image" alt="">
      <div class="detail">
        <form method="dialog"><button class="close" aria-label="Close image">×</button></form>
        <time id="large-date"></time>
        <h2 id="large-title"></h2>
        <p id="large-description"></p>
      </div>
    </div>
  </dialog>
  <script>
    const gallery = document.querySelector("#gallery");
    const viewer = document.querySelector("#viewer");
    const fmt = new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric",timeZone:"America/Los_Angeles"});
    const safe = value => String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    fetch("./gallery.json").then(r=>r.json()).then(items=>{
      for(const item of items){
        const date = new Date(item.created_at);
        const card = document.createElement("article");
        card.className="post";
        card.innerHTML = '<button class="image-button" aria-label="Open '+safe(item.title)+'"><img loading="lazy" src="'+safe(item.src)+'" alt="'+safe(item.title)+': '+safe(item.description)+'"></button><div class="meta"><div class="eyebrow"><span>Study</span><time datetime="'+safe(item.created_at)+'">'+fmt.format(date)+'</time></div><h2>'+safe(item.title)+'</h2><p>'+safe(item.description)+'</p></div>';
        card.querySelector("button").addEventListener("click",()=>{
          document.querySelector("#large-image").src=item.src;
          document.querySelector("#large-image").alt=item.title;
          document.querySelector("#large-title").textContent=item.title;
          document.querySelector("#large-description").textContent=item.description;
          document.querySelector("#large-date").textContent=fmt.format(date);
          if(typeof viewer.showModal==="function") viewer.showModal();
        });
        gallery.append(card);
      }
    }).catch(()=>{ gallery.innerHTML='<p>Gallery is unavailable.</p>'; });
  </script>
</body>
</html>
